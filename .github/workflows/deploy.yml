name: Deploy to GitHub Pages

# Workflow para desplegar la aplicación en GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create build directory
        run: |
          # Crear directorio _site y subdirectorios
          mkdir -p _site/js
          mkdir -p _site/css
          mkdir -p _site/images
          
          # Verificar que los directorios se crearon correctamente
          ls -la _site

      - name: Create env.js file
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Crear el archivo env.js
          cat > _site/js/env.js << EOF
          // API Keys configuration
          window.TMDB_API_KEY = "${TMDB_KEY}";
          window.GEMINI_API_KEY = "${GEMINI_KEY}";
          
          // Log para verificar que las keys están presentes
          console.log('API keys loaded:', {
              TMDB: window.TMDB_API_KEY ? 'Present' : 'Missing',
              GEMINI: window.GEMINI_API_KEY ? 'Present' : 'Missing'
          });
          EOF
          
          # Verificar que el archivo se creó y tiene contenido
          if [ -s "_site/js/env.js" ]; then
            echo "✅ env.js creado correctamente con $(wc -l < _site/js/env.js) líneas"
          else
            echo "❌ Error: env.js no se creó o está vacío"
            exit 1
          fi

      - name: Copy static files
        run: |
          # Copiar archivos estáticos evitando sobrescribir env.js
          cp -r css/* _site/css/ 2>/dev/null || true
          find js -type f ! -name 'env.js' -exec cp {} _site/js/ \; 2>/dev/null || true
          cp -r images/* _site/images/ 2>/dev/null || true
          cp index.html _site/
          
          # Verificar la estructura final
          echo "Contenido de _site/js:"
          ls -la _site/js/
          
          # Mostrar el contenido de env.js (ocultando las claves)
          echo "Primeras líneas de env.js:"
          head -n 1 _site/js/env.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 