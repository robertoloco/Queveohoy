name: Deploy to GitHub Pages

# Workflow para desplegar la aplicación en GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Create _site directory and subdirectories
        run: |
          mkdir -p _site/js
          mkdir -p _site/css
          mkdir -p _site/img

      - name: Create env.js with API keys
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "console.log('🔑 Cargando configuración...');" > _site/js/env.js
          echo "window.TMDB_API_KEY = '$TMDB_API_KEY';" >> _site/js/env.js
          echo "window.GEMINI_API_KEY = '$GEMINI_API_KEY';" >> _site/js/env.js
          echo "console.log('✅ API keys cargadas');" >> _site/js/env.js

      - name: Copy static files in order
        run: |
          # Primero copiamos los archivos base
          cp index.html _site/
          cp -r img/* _site/img/
          cp -r css/* _site/css/
          
          # Luego copiamos los archivos JS en orden específico
          cp js/config.js _site/js/
          cp js/api.js _site/js/
          cp js/ui.js _site/js/
          cp js/gemini.js _site/js/
          cp js/main.js _site/js/
          
          # Verificamos los archivos copiados
          echo "Contenido de _site/js/:"
          ls -la _site/js/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true 