name: Deploy to GitHub Pages

# Workflow para desplegar la aplicación en GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: |
          echo "🏗️ Creando estructura de directorios..."
          mkdir -p _site/js
          mkdir -p _site/css
          mkdir -p _site/images
          
      - name: Create env.js file
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🔑 Verificando claves API..."
          
          if [ -z "$TMDB_KEY" ]; then
            echo "❌ Error: TMDB_API_KEY no está configurada"
            exit 1
          else
            echo "✅ TMDB_API_KEY encontrada"
          fi
          
          if [ -z "$GEMINI_KEY" ]; then
            echo "❌ Error: GEMINI_API_KEY no está configurada"
            exit 1
          else
            echo "✅ GEMINI_API_KEY encontrada"
          fi
          
          echo "📝 Creando env.js..."
          cat > _site/js/env.js << EOF
          // API Keys configuration
          window.TMDB_API_KEY = '${TMDB_KEY}';
          window.GEMINI_API_KEY = '${GEMINI_KEY}';
          
          console.log('🔑 API keys cargadas correctamente');
          EOF
          
          echo "✅ env.js creado en _site/js/"

      - name: Copy files
        run: |
          echo "📂 Copiando archivos..."
          cp -r css/* _site/css/ || echo "No hay archivos CSS"
          cp -r js/* _site/js/ || echo "No hay archivos JS"
          cp -r images/* _site/images/ || echo "No hay imágenes"
          cp index.html _site/ || echo "No se encontró index.html"
          
          echo "📁 Contenido de _site:"
          ls -la _site/
          echo "📁 Contenido de _site/js:"
          ls -la _site/js/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages 