name: Deploy to GitHub Pages

# Workflow para desplegar la aplicación en GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Create build directory
        run: |
          # Crear directorio _site y copiar archivos
          mkdir -p _site
          cp -r * _site/ || true
          
          # Crear config.js
          echo "// Configuración generada durante el build" > _site/js/config.js
          echo "window.API_CONFIG = {" >> _site/js/config.js
          echo "  TMDB_API_KEY: '${{ secrets.TMDB_API_KEY }}'," >> _site/js/config.js
          echo "  GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'," >> _site/js/config.js
          echo "  TMDB_LANGUAGE: '${{ secrets.TMDB_LANGUAGE || 'es-ES' }}'," >> _site/js/config.js
          echo "  TMDB_REGION: '${{ secrets.TMDB_REGION || 'ES' }}'" >> _site/js/config.js
          echo "};" >> _site/js/config.js
          
          # Verificar contenido y estructura
          echo "Contenido de _site/js:"
          ls -la _site/js/
          echo "Contenido de config.js (sin mostrar claves):"
          cat _site/js/config.js | sed 's/\(TMDB_API_KEY: \).*,/\1[HIDDEN],/' | sed 's/\(GEMINI_API_KEY: \).*,/\1[HIDDEN],/'

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2 