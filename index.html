<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué veo hoy?</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iI2U1MDkxNCIgZD0iTTIwIDJINGMtMS4xIDAtMiAuOS0yIDJ2MTZjMCAxLjEuOSAyIDIgMmgxNmMxLjEgMCAyLS45IDItMlY0YzAtMS4xLS45LTItMi0yem0tOSAxM1Y5bDUgM2wtNSAzeiIvPjwvc3ZnPg==">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/platforms.css">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/adsbygoogle.js?client=ca-pub-TUCODIGO"></script>
    
    <!-- Scripts de configuración -->
    <script src="js/env.js"></script>
    
    <!-- Scripts principales -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/gemini.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>¿Qué veo hoy?</h1>
            <p>Descubre qué película o serie ver según tus plataformas</p>
        </header>

        <!-- Espacio para publicidad superior -->
        <div class="ad-container ad-top">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-TUCODIGO"
                 data-ad-slot="TUSLOT"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <!-- Contenedor para recomendaciones (tanto IA como sorpresa) -->
        <div id="recommendations-container">
            <div id="recommendations" style="display: none;"></div>
            <div id="resultado" style="display: none;"></div>
        </div>

        <!-- Espacio para publicidad lateral -->
        <div class="ad-container ad-sidebar">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-TUCODIGO"
                 data-ad-slot="TUSLOT"
                 data-ad-format="vertical"
                 data-full-width-responsive="false"></ins>
        </div>

        <div class="filters">
            <div class="platforms-section">
                <h2>Plataformas que tienes:</h2>
                <div class="platform-grid">
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Netflix" aria-label="Netflix">
                        <div class="platform-logo logo-netflix"></div>
                        <span>Netflix</span>
                    </label>
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Max" aria-label="Max">
                        <div class="platform-logo logo-max"></div>
                        <span>Max</span>
                    </label>
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Disney Plus" aria-label="Disney Plus">
                        <div class="platform-logo logo-disney"></div>
                        <span>Disney+</span>
                    </label>
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Amazon Prime Video" aria-label="Amazon Prime Video">
                        <div class="platform-logo logo-prime"></div>
                        <span>Prime</span>
                    </label>
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Apple TV Plus" aria-label="Apple TV Plus">
                        <div class="platform-logo logo-apple"></div>
                        <span>Apple TV+</span>
                    </label>
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Filmin" aria-label="Filmin">
                        <div class="platform-logo logo-filmin"></div>
                        <span>Filmin</span>
                    </label>
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Movistar Plus" aria-label="Movistar Plus">
                        <div class="platform-logo logo-movistar"></div>
                        <span>Movistar+</span>
                    </label>
                    <label class="checkbox-icon">
                        <input type="checkbox" value="Crunchyroll" aria-label="Crunchyroll">
                        <div class="platform-logo logo-crunchyroll"></div>
                        <span>Crunchyroll</span>
                    </label>
                </div>
            </div>

            <div class="content-type">
                <select id="contentType">
                    <option value="movie">Películas</option>
                    <option value="tv">Series</option>
                </select>
                <select id="genre">
                    <option value="">Todos los géneros</option>
                </select>
            </div>

            <div class="actions">
                <button id="sorprendeme" class="action-button">¡Sorpréndeme!</button>
                <div class="reference-search">
                    <input type="text" id="referenceInput" placeholder="O dime una película/serie que te guste...">
                    <button id="searchReference" class="action-button">Recomiéndame algo similar</button>
                </div>
            </div>
        </div>

        <!-- Espacio para publicidad inferior -->
        <div class="ad-container ad-bottom">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-TUCODIGO"
                 data-ad-slot="TUSLOT"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <div id="loadingMessage" style="display: none;">
            Buscando recomendación...
        </div>
    </div>

    <script>
        // Manejo de errores de carga de scripts
        window.addEventListener('error', function(e) {
            const errorMessage = document.getElementById('error-message');
            if (errorMessage) {
                errorMessage.textContent = 'Error al cargar la aplicación. Por favor, recarga la página.';
                errorMessage.style.display = 'block';
            }
            console.error('Error de script:', e);
        }, true);
    </script>
    <script type="module">
        if (!window.TMDB_API_KEY || !window.GEMINI_API_KEY) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = 'Error: No se han encontrado las claves API necesarias.';
            errorMessage.style.display = 'block';
        }
    </script>
    <script>
        // Inicializar los anuncios de AdSense
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</body>
</html>
