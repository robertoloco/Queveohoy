name: Deploy to GitHub Pages

# Workflow para desplegar la aplicación en GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create build directory
        run: |
          # Crear directorio _site y subdirectorios
          mkdir -p _site/js
          mkdir -p _site/css
          mkdir -p _site/images

      - name: Create config file
        run: |
          # Crear archivo de configuración con las API keys
          cat > _site/js/env.js << EOL
          // API Keys configuration
          window.TMDB_API_KEY = '${{ secrets.TMDB_API_KEY }}';
          window.GEMINI_API_KEY = '${{ secrets.GEMINI_API_KEY }}';
          console.log('API keys loaded:', {
              TMDB: window.TMDB_API_KEY ? 'Present' : 'Missing',
              GEMINI: window.GEMINI_API_KEY ? 'Present' : 'Missing'
          });
          EOL
          echo "Archivo de configuración creado en _site/js/env.js"

      - name: Copy static files
        run: |
          # Copiar archivos estáticos
          cp -r css/* _site/css/ || true
          cp -r js/* _site/js/
          cp -r images/* _site/images/ || true
          cp index.html _site/
          
          # Verificar estructura
          echo "Estructura del directorio _site:"
          ls -la _site
          echo "Estructura del directorio _site/js:"
          ls -la _site/js/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 