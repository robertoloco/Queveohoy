name: Deploy to GitHub Pages

# Workflow para desplegar la aplicación en GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          # Crear directorio _site
          mkdir -p _site/js
          
          # Crear config.js con las claves
          cat > _site/js/config.js << EOL
          // Configuración generada durante el build
          const config = {
            API_KEY: '${{ secrets.TMDB_API_KEY }}',
            GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}',
            TMDB_LANGUAGE: '${{ secrets.TMDB_LANGUAGE || 'es-ES' }}',
            TMDB_REGION: '${{ secrets.TMDB_REGION || 'ES' }}'
          };

          // Getters para las claves
          Object.defineProperties(config, {
            'API_KEY': {
              get() {
                if (!this._API_KEY) {
                  console.error('TMDB API Key no encontrada');
                  return '';
                }
                return this._API_KEY;
              },
              set(value) { this._API_KEY = value; }
            },
            'GEMINI_API_KEY': {
              get() {
                if (!this._GEMINI_API_KEY) {
                  console.error('Gemini API Key no encontrada');
                  return '';
                }
                return this._GEMINI_API_KEY;
              },
              set(value) { this._GEMINI_API_KEY = value; }
            }
          });

          // Inicializar valores
          config.API_KEY = '${{ secrets.TMDB_API_KEY }}';
          config.GEMINI_API_KEY = '${{ secrets.GEMINI_API_KEY }}';

          // Exponer configuración globalmente
          window.API_CONFIG = config;
          EOL
          
          # Copiar archivos estáticos
          cp -r css _site/
          cp -r js/* _site/js/
          cp -r images _site/ 2>/dev/null || true
          cp index.html _site/
          
          # Verificar estructura y contenido
          echo "Estructura del directorio _site/js:"
          ls -la _site/js/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 