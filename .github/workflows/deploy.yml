name: Deploy to GitHub Pages

# Workflow para desplegar la aplicación en GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create build directory
        run: |
          mkdir -p _site/js
          mkdir -p _site/css
          mkdir -p _site/images
          ls -la _site

      - name: Create env.js file
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Verificar que las claves existen
          if [ -z "$TMDB_KEY" ]; then
            echo "❌ Error: TMDB_API_KEY no está configurada"
            exit 1
          fi
          
          if [ -z "$GEMINI_KEY" ]; then
            echo "❌ Error: GEMINI_API_KEY no está configurada"
            exit 1
          fi
          
          # Crear el archivo env.js
          cat > _site/js/env.js << 'EOF'
          // API Keys configuration
          window.TMDB_API_KEY = '$TMDB_KEY';
          window.GEMINI_API_KEY = '$GEMINI_KEY';
          
          // Log para verificar que las keys están presentes
          console.log('API keys loaded:', {
              TMDB: window.TMDB_API_KEY ? 'Present' : 'Missing',
              GEMINI: window.GEMINI_API_KEY ? 'Present' : 'Missing'
          });
          EOF
          
          # Verificar que el archivo se creó y tiene contenido
          if [ -s "_site/js/env.js" ]; then
            echo "✅ env.js creado correctamente"
            echo "Tamaño del archivo: $(wc -c < _site/js/env.js) bytes"
          else
            echo "❌ Error: env.js no se creó o está vacío"
            exit 1
          fi

      - name: Copy static files
        run: |
          # Copiar archivos estáticos
          cp -r css/* _site/css/ || echo "No CSS files to copy"
          cp -r js/* _site/js/ || echo "No JS files to copy"
          cp -r images/* _site/images/ || echo "No image files to copy"
          cp index.html _site/ || echo "No index.html to copy"
          
          # Sobrescribir env.js con la versión correcta
          cat > _site/js/env.js << EOF
          // API Keys configuration
          window.TMDB_API_KEY = '$TMDB_KEY';
          window.GEMINI_API_KEY = '$GEMINI_KEY';
          
          // Log para verificar que las keys están presentes
          console.log('API keys loaded:', {
              TMDB: window.TMDB_API_KEY ? 'Present' : 'Missing',
              GEMINI: window.GEMINI_API_KEY ? 'Present' : 'Missing'
          });
          EOF
          
          # Verificar la estructura final
          echo "Contenido del directorio _site:"
          ls -la _site/
          echo "Contenido de _site/js:"
          ls -la _site/js/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 